name: CI/CD-HeroVired

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
       image: mongo:7
       ports:
         - 27017:27017
      

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
