name: CI/CD-HeroVired



on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    env: 
      MONGO_URI: ${{ secrets.MONGO_TEST_URI }}    
      

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4      

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install -r requirements.txt    

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: |
         docker build -t flask-practice:${{ github.sha }} .
         
      - name: EC2 credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Amazon ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env: 
         REGISTRY: ${{ steps.login-ecr.outputs.registry }}
         REPOSITORY: flask-practice
         IMAGE_TAG: ${{ github.sha }}
        run: |
         docker tag flask-practice:$IMAGE_TAG $REGISTRY/$REPOSITORY:$IMAGE_TAG
         docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: EC2-Deployment
        uses: appleboy/ssh-action@v1.2.2
        with: 
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            IMAGE="691317217805.dkr.ecr.ap-south-1.amazonaws.com/flask-practice:${{ github.sha }}"

            echo "ECR access"
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin \
              691317217805.dkr.ecr.ap-south-1.amazonaws.com

            echo "Getting new Image"
            docker pull $IMAGE

            echo "Stopping existing container.."
            docker stop flask-app || true

            echo "Removing existing container.."
            docker rm flask-app || true

            echo "Starting new container.."
            docker run -d \
             --name flask-app \
             --env-file /home/ubuntu/flask.env \
             -p 5000:5000 \
             $IMAGE

             echo "Waiting for application"
             sleep 10

             echo "Checking application health"
             curl --fail http://localhost:5000/health

             

            
          
        
